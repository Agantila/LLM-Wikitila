name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Unit-Tests
        run: python -W error::ResourceWarning -m unittest -v test_wikitila
      - name: Demo-Katalog validieren
        run: |
          python wikitila.py --root examples/demo-corpus build
          python validate_catalog.py --root examples/demo-corpus --catalog golden_catalog.example.jsonl | tee validate.txt
          grep -q "R@10 1.00" validate.txt
      - name: Installer-Rauchtest
        run: |
          mkdir -p "$RUNNER_TEMP/ziel" && cd "$RUNNER_TEMP/ziel" && git init -q
          printf '# Test\n\nEin kurzer Text über die Lieferantenliste für den Rauchtest.\n' > a.md
          bash "$GITHUB_WORKSPACE/install.sh" .
          test -f .wikitila/index.db
          grep -qxF '.wikitila/' .gitignore
